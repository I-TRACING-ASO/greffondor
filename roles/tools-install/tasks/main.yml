---

- name: Install basic packages
  become: true
  become_method: su
  become_user: root
  vars:
    ansible_become_password: "{{ become_password_root }}"
  block:
    - name: Install basic packages
      ansible.builtin.apt:
        pkg:
          - vim
          - tcpdump
          - git
          - curl
        state: latest
        update_cache: true

- name: Setup docker
  ansible.builtin.include_tasks: "1-docker.yml"

- name: Setup exegol
  ansible.builtin.include_tasks: "2-exegol.yml"

- name: Setup logger
  ansible.builtin.include_tasks: "3-logger.yml"

- name: Setup NetAlertX
  ansible.builtin.include_tasks: "4-NetAlertX.yml"

- name: Install Ligolo
  ansible.builtin.include_tasks: "5-ligolo.yml"

- name: Install nac_bypass
  ansible.builtin.include_tasks: "6-nac_bypass.yml"